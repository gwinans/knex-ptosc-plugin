name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.0.40
        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_ROOT_HOST: '%'
          MYSQL_DATABASE: ptosc
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysql -uroot -ptest -e 'SELECT 1'"
          --health-interval=5s --health-timeout=5s --health-retries=30
    env:
      DB_PASSWORD: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: integration/package-lock.json
      - name: Install Percona Toolkit
        run: |
          curl -fsSLo /tmp/percona-release.deb https://repo.percona.com/apt/percona-release_latest.generic_all.deb
          sudo apt-get install -y /tmp/percona-release.deb
          sudo percona-release enable tools release
          sudo apt-get update
          sudo apt-get install -y percona-toolkit
          pt-online-schema-change --version
      - name: Install this checkout into the fixture
        run: |
          package=$(npm pack --silent --pack-destination "$RUNNER_TEMP")
          cd integration
          npm ci
          npm install --no-save --package-lock=false "$RUNNER_TEMP/$package"
      - name: Migrate, verify, and roll back
        working-directory: integration
        run: |
          ./node_modules/.bin/knex --knexfile knexfile.cjs migrate:latest
          node verify.cjs up
          ./node_modules/.bin/knex --knexfile knexfile.cjs migrate:rollback
          node verify.cjs down
